openapi: 3.0.3
info:
  title: Avito.Kitchen API
  version: 2.0.0
  description: In-memory MVP API for shops, dishes, and orders.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /healthz:
    get:
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus exposition format
  /shops:
    get:
      summary: List active shops
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Shop"}
  /shops/{shopId}:
    get:
      summary: Get a shop
      parameters:
        - {$ref: "#/components/parameters/ShopId"}
      responses:
        "200": {description: Shop}
        "404": {description: Not found}
  /shops/{shopId}/dishes:
    get:
      summary: Filter, sort, and paginate dishes
      parameters:
        - {$ref: "#/components/parameters/ShopId"}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: category, schema: {type: string}}
        - {in: query, name: sort, schema: {type: string, enum: [price, price_desc, name, name_desc]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: Paginated dishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPage"
  /dishes:
    get:
      summary: List dishes across shops
      parameters:
        - {in: query, name: type, schema: {type: string}}
        - {in: query, name: shop_id, schema: {type: integer}}
        - {in: query, name: sort, schema: {type: string, enum: [price_asc, price_desc]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: Paginated dishes}
  /dishes/{dishId}:
    get:
      summary: Get a dish
      parameters:
        - {in: path, name: dishId, required: true, schema: {type: integer}}
      responses:
        "200": {description: Dish}
  /orders:
    post:
      summary: Create an empty order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_id]
              properties:
                shop_id: {type: integer}
      responses:
        "201": {description: Empty order}
  /orders/{orderId}:
    get:
      summary: Get an order
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200": {description: Order}
        "404": {description: Not found}
  /orders/{orderId}/items:
    post:
      summary: Add a dish to an order
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddItem"}
      responses:
        "201": {description: Updated order}
  /orders/{orderId}/items/{itemId}:
    patch:
      summary: Update an order item
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
        - {$ref: "#/components/parameters/ItemId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateItem"}
      responses:
        "200": {description: Updated order}
    delete:
      summary: Delete an order item
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
        - {$ref: "#/components/parameters/ItemId"}
      responses:
        "200": {description: Updated order}
  /orders/{orderId}/estimate:
    get:
      summary: Estimate preparation and delivery time
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200": {description: Estimate}
components:
  parameters:
    ShopId: {in: path, name: shopId, required: true, schema: {type: integer}}
    OrderId: {in: path, name: orderId, required: true, schema: {type: integer}}
    ItemId: {in: path, name: itemId, required: true, schema: {type: integer}}
  schemas:
    Shop:
      type: object
      required: [id, name, city, cuisine, delivery_time_min, is_active]
      properties:
        id: {type: integer}
        name: {type: string}
        city: {type: string}
        cuisine: {type: string}
        delivery_time_min: {type: integer}
        is_active: {type: boolean}
    Ingredient:
      type: object
      properties:
        id: {type: integer}
        dish_id: {type: integer}
        name: {type: string}
        removable: {type: boolean}
    Dish:
      type: object
      properties:
        id: {type: integer}
        shop_id: {type: integer}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        price_cents: {type: integer}
        preparation_time_min: {type: integer}
        is_available: {type: boolean}
        ingredients:
          type: array
          items: {$ref: "#/components/schemas/Ingredient"}
    DishPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Dish"}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
    AddItem:
      type: object
      required: [dish_id, quantity]
      properties:
        dish_id: {type: integer}
        quantity: {type: integer, minimum: 1}
        excluded_ingredient_ids:
          type: array
          items: {type: integer}
    UpdateItem:
      type: object
      required: [quantity]
      properties:
        quantity: {type: integer, minimum: 1}
        excluded_ingredient_ids:
          type: array
          items: {type: integer}
    OrderItem:
      type: object
      properties:
        id: {type: integer}
        order_id: {type: integer}
        dish_id: {type: integer}
        dish_name: {type: string}
        quantity: {type: integer}
        unit_price_cents: {type: integer}
        excluded_ingredient_ids:
          type: array
          items: {type: integer}
    Order:
      type: object
      properties:
        id: {type: integer}
        shop_id: {type: integer}
        status: {type: string}
        items:
          type: array
          items: {$ref: "#/components/schemas/OrderItem"}
        total_cents: {type: integer}
        estimated_time_min: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
